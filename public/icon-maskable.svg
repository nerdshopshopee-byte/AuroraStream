      <stop offset="0" stop-color="#05070b"/>
      <stop offset="1" stop-color="#0c1723"/>
    </linearGradient>
    <linearGradient id="aurm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
